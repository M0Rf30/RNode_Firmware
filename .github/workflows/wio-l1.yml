name: Wio Tracker L1 firmware

on:
  push:
    branches: [wio-tracker-l1]
    tags: ['wio-l1-*']
  pull_request:
    branches: [wio-tracker-l1]
  workflow_dispatch:

env:
  ARDUINO_CLI_VERSION: 1.5.1
  ADAFRUIT_NRF52_VERSION: 1.7.0
  ADAFRUIT_NRFUTIL_VERSION: 0.5.3.post16

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Arduino cores and libraries
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-nrf52-${{ hashFiles('.github/workflows/wio-l1.yml') }}

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o arduino-cli.tar.gz \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          tar -xzf arduino-cli.tar.gz -C "$HOME/.local/bin" arduino-cli
          rm arduino-cli.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install adafruit-nrfutil
        run: pip install "adafruit-nrfutil==${ADAFRUIT_NRFUTIL_VERSION}"

      - name: Install nRF52 core and libraries
        run: |
          arduino-cli core update-index --config-file arduino-cli.yaml
          arduino-cli core install adafruit:nrf52@$ADAFRUIT_NRF52_VERSION --config-file arduino-cli.yaml
          arduino-cli lib install "Adafruit GFX Library@1.12.6"
          arduino-cli lib install "Adafruit SH110X@2.1.15"
          arduino-cli lib install "Crypto@0.4.0"

      - name: Build
        run: |
          make release-wio_l1
          make release-wio_l1_1w

      - name: Report image sizes
        run: ls -l Release/rnode_firmware_wio_l1*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rnode_firmware_wio_l1
          path: Release/rnode_firmware_wio_l1*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/wio-l1-')
        uses: softprops/action-gh-release@v2
        with:
          files: Release/rnode_firmware_wio_l1*.zip
